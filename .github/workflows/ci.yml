name: CI

on:
  pull_request:
  push:
    branches: [main]
    # The `pa2` submission tag must also produce a run, so PA2.md can link
    # "the CI run for the tag". Without this line a tag push starts nothing.
    tags: [pa2]

# One job, one command: the workflow runs the same `make check` a developer
# runs locally. Nothing here is CI-only. A red `checks` status must be set as
# a required status check on main (see README section 8) so it can block a
# merge.
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # Backend has no third-party modules yet (no go.sum), so there is
          # nothing to cache.
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run every quality check
        run: make check
